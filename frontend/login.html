<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link href="https://fonts.gstatic.com" crossorigin rel="preconnect">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <style>body{margin:0;} ::-webkit-scrollbar{display:none;}</style>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: { extend: {
        colors: {
          "surface-container-highest":"#31353c","surface-container-low":"#181c22",
          "surface-container":"#1c2026","on-surface":"#dfe2eb","on-surface-variant":"#bbc9cd",
          "outline-variant":"#3c494c","outline":"#859397","surface-container-lowest":"#0a0e14",
          "primary":"#8aebff","primary-container":"#22d3ee","on-primary-fixed":"#001f25",
          "secondary":"#4ae176","tertiary":"#ffd961","error":"#ffb4ab",
        },
        fontFamily: {
          "body-md":["Plus Jakarta Sans"],"headline-lg":["Playfair Display"],
          "headline-sm":["Playfair Display"],"headline-md":["Playfair Display"],
          "label-md":["Plus Jakarta Sans"],"label-sm":["Plus Jakarta Sans"],"body-sm":["Plus Jakarta Sans"],
        },
      }},
    };
  </script>
</head>
<body class="bg-surface-container-lowest text-on-surface font-body-md min-h-screen flex items-center justify-center p-6">

  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight">Veridoc</h1>
      <p class="text-outline text-body-sm mt-1">Your second brain that never lies</p>
    </div>

    <div class="bg-surface-container-low rounded-2xl p-8 shadow-2xl border border-outline-variant/30">

      <button id="googleBtn" class="w-full flex items-center justify-center gap-3 py-3 rounded-lg bg-white text-gray-900 font-label-md hover:bg-gray-100 transition-all shadow-md">
        <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Continue with Google
      </button>

      <div class="flex items-center gap-3 my-6">
        <div class="flex-1 h-px bg-outline-variant/40"></div>
        <span class="text-outline text-label-sm">or</span>
        <div class="flex-1 h-px bg-outline-variant/40"></div>
      </div>

      <div class="flex gap-1 bg-surface-container-lowest rounded-lg p-1 mb-6">
        <button id="tabRegister" class="flex-1 py-2 rounded-md font-label-md text-primary bg-primary-container/15 transition-all">Register</button>
        <button id="tabLogin" class="flex-1 py-2 rounded-md font-label-md text-on-surface-variant hover:text-on-surface transition-all">Login</button>
      </div>

      <div id="authError" class="hidden mb-4 p-3 rounded-lg bg-error/10 text-error text-body-sm"></div>

      <form id="registerForm" class="flex flex-col gap-4">
        <input id="regName" type="text" placeholder="Full Name" required class="w-full bg-surface-container-lowest text-on-surface px-4 py-3 rounded-lg border border-outline-variant/40 focus:outline-none focus:border-primary-container transition-colors font-body-md">
        <input id="regEmail" type="email" placeholder="Email" required class="w-full bg-surface-container-lowest text-on-surface px-4 py-3 rounded-lg border border-outline-variant/40 focus:outline-none focus:border-primary-container transition-colors font-body-md">
        <input id="regPassword" type="password" placeholder="Password (min 6 characters)" required minlength="6" class="w-full bg-surface-container-lowest text-on-surface px-4 py-3 rounded-lg border border-outline-variant/40 focus:outline-none focus:border-primary-container transition-colors font-body-md">
        <button type="submit" id="registerBtn" class="w-full py-3 rounded-lg bg-primary-container text-on-primary-fixed font-label-md font-semibold hover:bg-primary transition-all shadow-md">Create Account</button>
        <p class="text-center text-body-sm text-outline">
          Already have an account?
          <button type="button" id="goLogin" class="text-primary hover:underline">Login</button>
        </p>
      </form>

      <form id="loginForm" class="hidden flex-col gap-4">
        <input id="logEmail" type="email" placeholder="Email" required class="w-full bg-surface-container-lowest text-on-surface px-4 py-3 rounded-lg border border-outline-variant/40 focus:outline-none focus:border-primary-container transition-colors font-body-md">
        <input id="logPassword" type="password" placeholder="Password" required class="w-full bg-surface-container-lowest text-on-surface px-4 py-3 rounded-lg border border-outline-variant/40 focus:outline-none focus:border-primary-container transition-colors font-body-md">
        <button type="submit" id="loginBtn" class="w-full py-3 rounded-lg bg-primary-container text-on-primary-fixed font-label-md font-semibold hover:bg-primary transition-all shadow-md">Login</button>
        <p class="text-center text-body-sm text-outline">
          Don't have an account?
          <button type="button" id="goRegister" class="text-primary hover:underline">Create one</button>
        </p>
      </form>

      <div class="mt-6 pt-6 border-t border-outline-variant/30 text-center">
        <button id="guestBtn" class="text-outline text-body-sm hover:text-primary transition-colors">
          Continue as Guest →
        </button>
      </div>
    </div>

    <p class="text-center text-body-sm text-outline mt-6">
      Your documents stay private. Nothing is shared.
    </p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/auth.js"></script>
  <script src="assets/login.js"></script>
</body>
</html>
